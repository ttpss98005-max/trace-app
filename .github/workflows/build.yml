name: Build APK

on:
  push:
    branches-ignore: [ci-shots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk trace.apk
          gh release create "v${{ github.run_number }}" trace.apk \
            --title "軌跡 App v${{ github.run_number }}" \
            --notes "手機上點 trace.apk 下載並安裝。"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: trace.apk

  # Runs the APK on an emulator in both orientations and keeps the screenshots on the ci-shots branch.
  # A failure here never blocks the APK above.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p shots
            adb install -r trace.apk
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put system accelerometer_rotation 0
            rot() { adb shell cmd window user-rotation lock "$1" || adb shell settings put system user_rotation "$1"; sleep 5; }
            run() { adb shell am start -S -n tw.trace.app/.MainActivity --ez demo true --es screen "$1"; sleep 8; }
            shot() { adb exec-out screencap -p > "shots/$1.png"; }
            sleep 45
            rot 0
            run board; shot port-board
            run panel; shot port-panel
            rot 1; shot land-panel-rotated
            run settings; shot land-settings
            run board; shot land-board
            run hub; shot land-hub
            run login; shot land-login
            rot 0
            run board; rot 1; shot land-board-rotated; rot 0; shot port-board-rotated
            run hub; shot port-hub
            run settings; shot port-settings
            run login; shot port-login
            adb logcat -d -b crash > shots/crash.txt || true

      - name: Keep screenshots
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots of run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-shots
